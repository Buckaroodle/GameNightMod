[[patches]] # only runs when boss is defeated
[patches.pattern]
target = "functions/state_events.lua"
pattern = "local discard_count = #G.discard.cards"
position = "before"
payload = '''
if #G.bgn_holepunched_discard.cards > 0 and G.GAME.blind.boss then
    local holepunched_discard_count = #G.bgn_holepunched_discard.cards
    for i=1, holepunched_discard_count do --draw cards from deck
        draw_card(G.bgn_holepunched_discard, G.deck, i*100/holepunched_discard_count,'up', nil ,nil, 0.005, i%2==0, nil, math.max((21-i)/20,0.7))
    end
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "if G.GAME.dollars >= 5 and not G.GAME.modifiers.no_interest then"
position = "before"
payload = '''
if G.GAME.bgn_holepunchedtotal then
    if G.GAME.bgn_holepunchedtotal > 0 then
        add_round_eval_row({dollars = (G.GAME.bgn_holepunchedtotal * 2), number = tostring(G.GAME.bgn_holepunchedtotal), number_colour = G.C.YELLOW, text = 'Hole Punched Bonus', text_colour = G.C.WHITE, bonus = true, name='m_bgn_holepunched'..i, pitch = pitch })
        pitch = pitch + 0.06
        dollars = dollars + (G.GAME.bgn_holepunchedtotal * 2)
    end
end
if G.GAME.blind:get_type() == 'Boss' then
    G.GAME.bgn_holepunchedtotal = 0
end
'''
match_indent = true
