[manifest]
version = "1.0.0"
priority = 0

[[patches]] #For debuffed played cards
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = "--if card is debuffed"
position = "after"
match_indent = true
payload = '''
if scoring_hand and card.debuff then
    if in_scoring and next(SMODS.find_card("j_bgn_taboo")) then
        for k, v in pairs(SMODS.find_card("j_bgn_taboo")) do
            if card.debuff then
                SMODS.calculate_effect({xmult = v.ability.extra.xmult}, card)
            end
        end
    end
end
'''

[[patches]] #For debuffed joker cards
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if not card:can_calculate(context.ignore_debuff, context.remove_playing_cards*"
position = "before"
match_indent = true
payload = '''
if context.joker_main and next(SMODS.find_card("j_bgn_taboo")) and not context.blueprint then
    for k, v in pairs(SMODS.find_card("j_bgn_taboo")) do
        if card.debuff then
            SMODS.calculate_effect({xmult = v.ability.extra.xmult}, card)
        end
    end
end
'''

[[patches]] #add hole punched card discard area, adapted from AIJ's line in the sand
[patches.pattern]
target = "game.lua"
pattern = "self.discard = CardArea("
position = "before"
match_indent = true
payload = '''
self.bgn_holepunched_discard = CardArea(
    0, 0,
    CAI.discard_W,CAI.discard_H,
    {card_limit = 1e308, type = 'discard'})
'''

[[patches]] 
[patches.pattern]
target = "functions/state_events.lua"
pattern = "draw_card(G.hand, G.discard, i*100/highlighted_count, 'down', false, G.hand.highlighted[i])"
position = "at"
payload = '''
if SMODS.has_enhancement(G.hand.highlighted[i], "m_bgn_holepunched") then
    G.GAME.bgn_holepunchedtotal = (G.GAME.bgn_holepunchedtotal or 0) + 1
    draw_card(G.hand, G.bgn_holepunched_discard, i*100/highlighted_count, 'down', false, G.hand.highlighted[i])
else
    draw_card(G.hand, G.discard, i*100/highlighted_count, 'down', false, G.hand.highlighted[i])
end
'''
match_indent = true

