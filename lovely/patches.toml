[manifest]
version = "1.0.0"
priority = 0

[[patches]] #For debuffed played cards
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = "--if card is debuffed"
position = "after"
match_indent = true
payload = '''
if scoring_hand and card.debuff then
    if in_scoring and next(SMODS.find_card("j_bgn_taboo")) then
        for k, v in pairs(SMODS.find_card("j_bgn_taboo")) do
            if card.debuff then
                SMODS.calculate_effect({xmult = v.ability.extra.xmult}, card)
            end
        end
    end
end
'''

[[patches]] #For debuffed joker cards
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if not card:can_calculate(context.ignore_debuff, context.remove_playing_cards*"
position = "before"
match_indent = true
payload = '''
if context.joker_main and next(SMODS.find_card("j_bgn_taboo")) and not context.blueprint then
    for k, v in pairs(SMODS.find_card("j_bgn_taboo")) do
        if card.debuff then
            SMODS.calculate_effect({xmult = v.ability.extra.xmult}, card)
        end
    end
end
'''