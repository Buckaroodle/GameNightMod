[[patches]] # only runs when boss is defeated
[patches.pattern]
target = "functions/state_events.lua"
pattern = "local discard_count = #G.discard.cards"
position = "before"
payload = '''
if #G.bgn_holepunched_discard.cards > 0 and G.GAME.blind.boss then
    local holepunched_discard_count = #G.bgn_holepunched_discard.cards
    for i=1, holepunched_discard_count do --draw cards from deck
        draw_card(G.bgn_holepunched_discard, G.deck, i*100/holepunched_discard_count,'up', nil ,nil, 0.005, i%2==0, nil, math.max((21-i)/20,0.7))
    end
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "if G.GAME.dollars >= 5 and not G.GAME.modifiers.no_interest then"
position = "before"
payload = '''
if G.GAME.bgn_holepunchedtotal then
    if G.GAME.bgn_holepunchedtotal > 0 then
        add_round_eval_row({dollars = (G.GAME.bgn_holepunchedtotal * 2), text = ' Hole Punched Cards ($2 each)', text_colour = G.C.WHITE, disp = G.GAME.bgn_holepunchedtotal, number = 1, number_colour = G.C.RED, bonus = true, name = 'other'..i , pitch = pitch })
        pitch = pitch + 0.06
        dollars = dollars + (G.GAME.bgn_holepunchedtotal * 2)
    end
end
if G.GAME.blind:get_type() == 'Boss' then
    G.GAME.bgn_holepunchedtotal = 0
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "elseif string.find(config.name, 'joker') then"
position = "before"
payload = '''
elseif string.find(config.name, 'other') then
    local loc_opts = config.loc_opts or {}
    table.insert(left_text, {n=G.UIT.T, config={text = config.disp, scale = 0.8*scale, colour = G.C.WHITE, shadow = true, juice = true}})
    table.insert(left_text, {n=G.UIT.O, config={object = DynaText({string = {""..config.text}, colours = {loc_opts.text_colour or G.C.WHITE}, shadow = true, pop_in = 0, scale = 0.4*scale, silent = true})}})
'''
match_indent = true

#ease_discard(-1)

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "ease_discard(-1)"
position = "at"
payload = '''
if G.GAME.bgn_onlyhands == true then
    ease_hands_played(-1)
else
    ease_discard(-1)
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "if G.GAME.current_round.discards_left <= 0 or #G.hand.highlighted <= 0 or #G.hand.highlighted > math.max(G.GAME.starting_params.discard_limit, 0) then"
position = "at"
payload = '''
if ((G.GAME.current_round.discards_left <= 0) and not G.GAME.bgn_onlyhands) or ((G.GAME.current_round.hands_left <= 1) and G.GAME.bgn_onlyhands) or #G.hand.highlighted <= 0 or #G.hand.highlighted > math.max(G.GAME.starting_params.discard_limit, 0) then
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "G.GAME.current_round.hands_left = G.GAME.current_round.hands_left + mod"
position = "after"
payload = '''
if G.GAME.bgn_onlyhands then
    G.GAME.current_round.discards_left = G.GAME.current_round.hands_left
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''
G.GAME.current_round.discards_left = math.max(0, G.GAME.round_resets.discards + G.GAME.round_bonus.discards)
G.GAME.current_round.hands_left = (math.max(1, G.GAME.round_resets.hands + G.GAME.round_bonus.next_hands))
'''
position = "at"
payload = '''
if G.GAME.bgn_onlyhands then
    G.GAME.current_round.hands_left = (math.max(1, G.GAME.round_resets.hands + G.GAME.round_bonus.next_hands + G.GAME.round_resets.discards + G.GAME.round_bonus.discards))
    G.GAME.current_round.discards_left = G.GAME.current_round.hands_left
else
    G.GAME.current_round.discards_left = math.max(0, G.GAME.round_resets.discards + G.GAME.round_bonus.discards)
    G.GAME.current_round.hands_left = (math.max(1, G.GAME.round_resets.hands + G.GAME.round_bonus.next_hands))
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "if not nosave_shop then SMODS.calculate_context({starting_shop = true}) end"
position = "at"
payload = '''
if not nosave_shop then
SMODS.calculate_context({starting_shop = true})
G.GAME.total_rerolls_on_shop_entry = G.GAME.round_scores.times_rerolled.amt
end
'''
match_indent = true

# taken from AIJ's patches
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
for k, v in ipairs(pack_cards) do
    G.pack_cards:emplace(v)
end
'''
position = "after"
match_indent = true
payload = '''
SMODS.calculate_context({bucksgamenight = {modify_booster_cards = true, card = self, pack_cards = pack_cards}}) 
'''

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = 'G.hand.highlighted[i]:calculate_seal({discard = true})'
position = 'after'
match_indent = true
payload = '''
G.hand.highlighted[i].ability.was_discarded = true
'''

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = 'total_cashout_rows = 0'
position = 'before'
match_indent = true
payload = '''
for i, card in ipairs(G.playing_cards) do
    card.ability.was_discarded = false
end
'''

